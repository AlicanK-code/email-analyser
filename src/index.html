<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email-Analyser</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<!-- Flex container to use column direction to wrap elements so they can stack (button & table)-->
<body class="bg-info-subtle d-flex flex-column justify-content-center align-items-center vh-100">

    <div class="bg-info bg-opacity-10 border border-info-subtle border-3 rounded-3 p-4 w-50 text-center position-relative">

    <!--Table construction to represent data-->
    <div id="tableContainer" class="mb-4" style="overflow-y: auto; max-height: 400px;"> <!-- Overflow forces scroll bar if too high y-axis -->
    <table class="table table-hover" id="emailTable" style="display: none;">  <!-- display: none; hides table initially till table.style.display ="table"; is trigged in client.js-->
  <thead class="table-info sticky-top"> <!-- Adds background colour to the header & freezes headings in place-->
    <tr>
      <th scope="col">Domain</th>
      <th scope="col">Count</th>
    </tr>
  </thead>
  <tbody id="tableBody">
    </tbody>
</table>
</div>

    <button type="button" id="btn" class="btn btn-info text-white px-5 shadow-sm position-relative">Retrieve</button>
<div>
  <button type="button" class="btn btn-info text-white px-2 shadow-sm position-absolute" style="bottom: 10px; right: 10px">
    <i class="bi bi-gear-fill"></i>
  </button>
</div>
</div>

    <script src="client.js"></script>

</body>
</html>
